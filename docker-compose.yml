# ==============================================================================
# AI TICKET TRIAGE SYSTEM — DOCKER COMPOSE MULTI-CONTAINER ORCHESTRATION
# ==============================================================================
# This Compose file orchestrates a 3-service microservice architecture:
# 1. TRAINER   (One-shot ML training job that generates model.joblib)
# 2. API       (Long-running FastAPI web service serving inference requests)
# 3. EVALUATOR (One-shot evaluation job producing metrics.json)
# ==============================================================================

version: '3.8'

services:
  # ============================================================================
  # SERVICE 1: ML TRAINER (Member 1 Scope)
  # One-shot training job. Reads training dataset from host `./data`, trains TF-IDF
  # + Logistic Regression pipeline, and outputs `model.joblib` to shared volume.
  # ============================================================================
  trainer:
    build:
      context: ./trainer
      dockerfile: Dockerfile
    container_name: triage_trainer
    # Bind-mount host dataset read-only and write model.joblib to shared volume
    volumes:
      - ./data:/app/data:ro
      - models_data:/app/models
    # One-shot job: do not auto-restart once training completes (exit code 0)
    restart: "no"
    networks:
      - triage_network

  # ============================================================================
  # SERVICE 2: FASTAPI BACKEND API (Member 2 Scope)
  # Long-running REST API serving prediction endpoints, health probes, and metrics.
  # ============================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: triage_api
    ports:
      - "8000:8000"
    # Read environment variables from root .env file
    env_file:
      - .env
    volumes:
      # Mount shared model volume READ-ONLY for security and data integrity
      - models_data:/app/models:ro
    # ==========================================================================
    # DEPENDENCY ORDERING (Docker Compose v2+ Syntax):
    # `service_completed_successfully` guarantees that the API container WILL NOT
    # start until the `trainer` container has finished training and exited cleanly (exit code 0).
    # This prevents boot race conditions where API starts before model.joblib is generated.
    # ==========================================================================
    depends_on:
      trainer:
        condition: service_completed_successfully
    # ==========================================================================
    # HEALTHCHECK DEFINITION
    # Declaring the healthcheck directly in docker-compose.yml makes service health
    # status ('healthy' vs 'unhealthy') immediately visible to hackathon judges 
    # at a glance when executing `docker compose ps`.
    # Uses Python's stdlib urllib to probe GET /health without needing curl installed.
    # ==========================================================================
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - triage_network

  # ============================================================================
  # SERVICE 3: MODEL EVALUATOR (Member 1 / Shared Scope)
  # One-shot evaluation job. Evaluates trained model performance on test dataset,
  # outputting `metrics.json` back to host filesystem.
  # ============================================================================
  evaluator:
    build:
      context: ./evaluator
      dockerfile: Dockerfile
    container_name: triage_evaluator
    volumes:
      # Read-only access to model artifact
      - models_data:/app/models:ro
      # Read-only access to evaluation dataset
      - ./data:/app/data:ro
      # Bind-mount host output folder so metrics.json persists on host filesystem for demo inspection
      - ./evaluator/output:/app/output
    depends_on:
      trainer:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - triage_network

# ==============================================================================
# NAMED VOLUMES
# `models_data`: Managed volume passing model.joblib securely between trainer
# and downstream API / evaluator containers.
# ==============================================================================
volumes:
  models_data:
    driver: local

# ==============================================================================
# CUSTOM BRIDGE NETWORK
# `triage_network`: Isolated network enabling DNS resolution between containers.
# ==============================================================================
networks:
  triage_network:
    driver: bridge
